plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned rather than 'latest.release' so a local build is reproducible and so the
// version this project's docs quote is the version actually compiled and tested
// against, rather than whatever the hub happened to resolve on the day somebody
// last ran a build. Bump deliberately after an OSRS update, run ./gradlew test,
// then update this line and the README's version badge together. The Plugin Hub's
// own packager substitutes its own build.gradle for `build=standard` submissions
// and always builds against its own resolved client version regardless of what
// this file says, so this pin affects local dev and test builds only, never what
// actually ships. 1.12.38 is the newest <release> (never <latest>, which is a
// snapshot) in https://repo.runelite.net/net/runelite/client/maven-metadata.xml
// as of this scaffold.
def runeLiteVersion = '1.12.38'
def pluginMainClass = 'com.matthewmariner.gunnarstools.GunnarsToolsPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.matthewmariner.gunnarstools'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// A green bar with no names is not a report. Name every test that ran.
tasks.named('test') {
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = false
		exceptionFormat = 'full'
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
